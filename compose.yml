services:
  backend:
    image: ${QUOTES_IMAGE:-pabpereza/quotes}
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "80:80"
    env_file:
      - .env
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
       resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 200M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/probes/health')"]
      interval: 10s
      timeout: 10s
      retries: 3
     
  postgres:
    image: postgres
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    
volumes:
  postgres-data:

