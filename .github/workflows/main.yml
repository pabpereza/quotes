name: Main Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write
  actions: read
  attestations: read
  checks: read
  deployments: read
  discussions: read
  issues: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  statuses: read
  id-token: write

jobs:
  build:
    name: Build
    uses: ./.github/actions/build.yml
   
  trivy:
    needs: build
    name: Run Trivy Workflow
    uses: ./.github/actions/trivy.yml

  scorecard:
    needs: build
    name: Run Scorecard Workflow
    uses: ./.github/actions/scorecard.yml

  bandit:
    needs: build
    name: Run Bandit Workflow
    uses: ./.github/actions/bandit.yml